<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AYHEM — Glitch Layer</title>

<style>
body {
    margin:0;
    background:#050914;
    color:#e8ecff;
    overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}

/* الحاوية */
.glitch-container {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* الصورة */
.glitch-container {
    background:
      radial-gradient(ellipse at 50% 45%, rgba(20,72,115,.65), transparent 55%),
      linear-gradient(135deg,#050914 0%,#101a35 50%,#03050c 100%);
}
.glitch-container::before,
.glitch-container::after {
    content:"";
    position:absolute;
    inset:-20%;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(90,180,255,.07) 4px,transparent 5px 8px);
    animation:scan 7s linear infinite;
    pointer-events:none;
}
.glitch-container::after {
    background:linear-gradient(90deg,transparent 0 47%,rgba(0,240,255,.10) 49%,transparent 52%);
    animation:drift 5s ease-in-out infinite alternate;
}
@keyframes scan { from { transform:translateY(-4%); } to { transform:translateY(4%); } }
@keyframes drift { from { transform:translateX(-4%); } to { transform:translateX(4%); } }

/* طبقات التشويه */
.glitch-layer {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    mix-blend-mode:screen;
    opacity:0.7;
    pointer-events:none;
}

/* النص */
.overlay-text {
    position:absolute;
    bottom:clamp(20px,6vh,60px);
    right:clamp(20px,6vw,60px);
    color:#d8f8ff;
    font-size:28px;
    max-width:400px;
    line-height:1.4;
    text-shadow:0 0 10px #00f0ff;
    z-index:2;
}
</style>

</head>

<body>

<div class="glitch-container">
    <div class="glitch-layer" id="l1"></div>
    <div class="glitch-layer" id="l2"></div>
    <div class="glitch-layer" id="l3"></div>

    <div class="overlay-text">
        AYHEM — أول عقل رقمي حي<br>
        ليس ما تراه…<br>
        بل ما يُعاد بناؤه داخلك
    </div>
</div>

<script>

function glitch(layer, power) {
    setInterval(() => {
        let x = (Math.random() - 0.5) * power;
        let y = (Math.random() - 0.5) * power;
        let skew = (Math.random() - 0.5) * power;

        layer.style.transform =
            `translate(${x}px, ${y}px) skew(${skew}deg)`;

        layer.style.opacity = 0.5 + Math.random() * 0.5;
    }, 100);
}

function start() {
    const layers = [
        document.getElementById("l1"),
        document.getElementById("l2"),
        document.getElementById("l3")
    ];

    layers.forEach((layer, i) => {
        layer.style.backgroundImage = "linear-gradient(135deg,rgba(0,240,255,.12),rgba(120,80,255,.08))";
        glitch(layer, (i+1)*20);
    });
}

start();

</script>

</body>
</html>
