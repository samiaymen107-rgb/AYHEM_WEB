<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYHEM — Glitch Layer</title>

<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
}

/* الحاوية */
.glitch-container {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* الصورة */
.glitch-container img {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* طبقات التشويه */
.glitch-layer {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    mix-blend-mode:screen;
    opacity:0.7;
}

/* النص */
.overlay-text {
    position:absolute;
    bottom:40px;
    left:40px;
    color:#00f0ff;
    font-size:28px;
    max-width:400px;
    line-height:1.4;
    text-shadow:0 0 10px #00f0ff;
}
</style>

</head>

<body>

<div class="glitch-container">
    <img src="image.jpg">

    <div class="glitch-layer" id="l1"></div>
    <div class="glitch-layer" id="l2"></div>
    <div class="glitch-layer" id="l3"></div>

    <div class="overlay-text">
        AYHEM — أول عقل رقمي حي<br>
        ليس ما تراه…<br>
        بل ما يُعاد بناؤه داخلك
    </div>
</div>

<script>

function glitch(layer, power) {
    setInterval(() => {
        let x = (Math.random() - 0.5) * power;
        let y = (Math.random() - 0.5) * power;
        let skew = (Math.random() - 0.5) * power;

        layer.style.transform =
            `translate(${x}px, ${y}px) skew(${skew}deg)`;

        layer.style.opacity = 0.5 + Math.random() * 0.5;
    }, 100);
}

function start() {
    const layers = [
        document.getElementById("l1"),
        document.getElementById("l2"),
        document.getElementById("l3")
    ];

    layers.forEach((layer, i) => {
        layer.style.backgroundImage = "url('image.jpg')";
        glitch(layer, (i+1)*20);
    });
}

start();

</script>

</body>
</html>
