<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AYHEM Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: #0b0f14;
      color: #e0e6ed;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 10px;
    }
    .box {
      border: 1px solid #1f2a36;
      padding: 10px;
      background: #111823;
      border-radius: 10px;
    }
    h3 {
      margin-top: 0;
      color: #4da3ff;
    }
    video {
      width: 100%;
      background: black;
      border-radius: 8px;
    }
    pre {
      white-space: pre-wrap;
      font-size: 12px;
      margin: 0;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="grid">
  <div class="box">
    <h3>👁️ الرؤية</h3>
    <video id="cam" autoplay muted playsinline controls aria-label="عرض الكاميرا"></video>
  </div>

  <div class="box">
    <h3>👂 السمع</h3>
    <pre id="audio"></pre>
  </div>

  <div class="box">
    <h3>🧠 السياق</h3>
    <pre id="context"></pre>
  </div>

  <div class="box">
    <h3>🧭 القرار / الرد</h3>
    <pre id="decision"></pre>
  </div>
</div>

<script type="module" src="ayhem-dashboard.js"></script>
</body>
</html>
