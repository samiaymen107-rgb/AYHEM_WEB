name: AYHEM Android APK (free test build)

on:
  workflow_dispatch:
  push:
    branches:
      - android/play-store
    paths:
      - "**"
      - "!README.md"

permissions:
  contents: read

concurrency:
  group: ayhem-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Capacitor dependencies
        run: npm install
      - name: Prepare web application
        run: npm run android:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Install image conversion utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Apply AYHEM launcher icon
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case "$density" in
              mdpi) size=48 ;;
              hdpi) size=72 ;;
              xhdpi) size=96 ;;
              xxhdpi) size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            mkdir -p "android/app/src/main/res/mipmap-$density"
            convert assets/ayhem-logo.jpg -resize "${size}x${size}!" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Synchronize Android assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AYHEM-Android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
# verified AYHEM logo asset is now committed at assets/ayhem-logo.jpg
