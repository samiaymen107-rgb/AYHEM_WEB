name: AYHEM Governance Tests
# Scorecard validation is required for governance and progress-dashboard changes.

on:
  pull_request:
    paths:
      - "docs/governance/**"
      - "docs/operations/**"
      - "README.md"
      - "tools/validate-governance.mjs"
      - ".github/workflows/ayhem-governance-tests.yml"
  push:
    branches: [main]
    paths:
      - "docs/governance/**"
      - "docs/operations/**"
      - "README.md"
      - "tools/validate-governance.mjs"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate founder directives and progress scorecard
        run: node tools/validate-governance.mjs
