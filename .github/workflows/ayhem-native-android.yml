name: AYHEM AI Unified Debug Android APK
on:
  push:
    branches:
      - native/ayhem-ai-kotlin-v1
      - native/ayhem-ai-v1.1-stable
      - native/ayhem-ai-unified-debug
    paths:
      - 'native-android/**'
      - '.github/workflows/ayhem-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 34 platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: native-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYHEM-AI-Unified-Debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
