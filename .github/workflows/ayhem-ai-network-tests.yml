name: AYHEM AI Network Client Tests

on:
  pull_request:
    paths:
      - "integrations/ai-network/**"
      - "integrations/supabase/**"
      - "supabase/functions/**"
      - "index.html"
      - "ayhem-fix-send.js"
      - "AYHEM_JS_Worker.js"
      - "contracts/ai-gateway/**"
      - ".github/workflows/ayhem-ai-network-tests.yml"
  push:
    branches: [main, integration/ayhem-unified-cloud-runtime-v1]
    paths:
      - "integrations/ai-network/**"
      - "integrations/supabase/**"
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false
      - name: Run AI network client tests
        working-directory: integrations/ai-network
        run: npm test
      - name: Check Supabase integration modules
        run: |
          node --check integrations/supabase/ayhem-auth-ui.js
          node --check integrations/supabase/ayhem-memory-ui.js
          node --check integrations/supabase/ayhem-tinyfish-ui.js
          node --check integrations/ai-network/ayhem-supabase-ai-ui.js
