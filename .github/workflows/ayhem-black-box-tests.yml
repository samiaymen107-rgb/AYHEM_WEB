name: AYHEM Black Box Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/black-box/**"
      - "integrations/ai-network/**"
      - "integrations/supabase/ayhem-remote-memory.js"
      - "tools/legacy-memory-audit.html"
      - ".github/workflows/ayhem-black-box-tests.yml"
  push:
    branches: [main]
    paths:
      - "core/black-box/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run foundation tests
        working-directory: core/black-box
        run: npm test
      - name: Install Chromium test runtime
        working-directory: core/black-box
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real-browser integration tests
        working-directory: core/black-box
        run: npm run test:browser
      - name: Run cognition scan benchmark smoke
        working-directory: core/black-box
        run: npm run benchmark:cognition
