name: AYHEM Supabase Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/tests/**"
      - "supabase/migrations/**"
      - "integrations/supabase/**"
      - ".github/workflows/ayhem-supabase-contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/tests/**"
      - "supabase/migrations/**"
      - "integrations/supabase/**"
      - ".github/workflows/ayhem-supabase-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayhem-supabase-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ayhem_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ayhem_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Supabase security contract tests
        run: deno test --allow-env --allow-read=index.html,supabase/functions,supabase/migrations,integrations/supabase,integrations/ai-network supabase/tests/contract.test.ts supabase/functions/tests/edge-handlers.integration.test.ts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Run isolated PostgreSQL quota integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayhem_contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rate_limit_postgres.integration.sql
      - name: Verify private file-library Storage policies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayhem_contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/private_file_library_postgres.integration.sql
      - name: Verify concurrent quota increments
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ayhem_contract
        run: |
          set -euo pipefail
          user_id="33333333-3333-4333-8333-333333333333"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users (id) VALUES ('$user_id');"
          while [ "$(date -u +%S)" -gt 50 ]; do sleep 1; done
          results="$(mktemp)"
          trap 'rm -f "$results"' EXIT
          pids=()
          for i in $(seq 1 25); do
            (
              psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub', '$user_id', false); SELECT allowed FROM public.ayhem_consume_rate_limit();" | tail -n 1
            ) >> "$results" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          allowed="$(grep -cx 't' "$results" || true)"
          denied="$(grep -cx 'f' "$results" || true)"
          if [ "$allowed" -ne 20 ] || [ "$denied" -ne 5 ]; then
            cat "$results"
            echo "Expected exactly 20 allowed and 5 denied concurrent requests; got $allowed allowed and $denied denied."
            exit 1
          fi
          counter="$(psql "$DATABASE_URL" -X -qAt -c "SELECT request_count FROM public.ayhem_rate_limit_windows WHERE user_id = '$user_id';")"
          if [ "$counter" -ne 21 ]; then
            echo "Expected saturated counter 21 after concurrent requests; got $counter."
            exit 1
          fi
          echo "Concurrent quota test passed: 20 allowed, 5 denied, counter saturated at 21."
