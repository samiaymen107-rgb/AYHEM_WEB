<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYHEM — العقل الرقمي الحي</title>

<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:#00f0ff;
}

/* الحاوية */
.glitch-container {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* الصورة */
.glitch-container img {
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

/* طبقات التشويه */
.glitch-layer {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    mix-blend-mode:screen;
    opacity:0.7;
}

/* النص التراكبي */
.overlay-text {
    position:absolute;
    bottom:40px;
    left:40px;
    color:#00f0ff;
    font-size:28px;
    max-width:400px;
    line-height:1.4;
    text-shadow:0 0 10px #00f0ff;
}

/* واجهة التفاعل */
.interactive-panel {
    position:absolute;
    top:40px;
    right:40px;
    width:300px;
    background:rgba(0,0,0,0.7);
    border:1px solid #00f0ff;
    padding:20px;
    border-radius:10px;
}

.interactive-panel input[type="text"] {
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:#000;
    color:#00f0ff;
    border:1px solid #00f0ff;
    border-radius:5px;
}

.interactive-panel button {
    width:100%;
    padding:10px;
    background:#00f0ff;
    color:#000;
    border:none;
    cursor:pointer;
    font-weight:bold;
    border-radius:5px;
}

.response-box {
    margin-top:10px;
    background:rgba(0,0,0,0.5);
    padding:10px;
    border-radius:5px;
    min-height:60px;
    overflow-y:auto;
}
</style>
</head>

<body>

<div class="glitch-container">
    <img src="image.jpg">

    <div class="glitch-layer" id="l1"></div>
    <div class="glitch-layer" id="l2"></div>
    <div class="glitch-layer" id="l3"></div>

    <div class="overlay-text">
        AYHEM — أول عقل رقمي حي<br>
        ليس ما تراه…<br>
        بل ما يُعاد بناؤه داخلك
    </div>
</div>

<div class="interactive-panel">
    <input type="text" id="userInput" placeholder="اكتب هنا...">
    <button id="sendBtn">تفاعل</button>
    <div class="response-box" id="responseBox"></div>
</div>

<script>
function glitch(layer, power) {
    setInterval(() => {
        let x = (Math.random() - 0.5) * power;
        let y = (Math.random() - 0.5) * power;
        let skew = (Math.random() - 0.5) * power;

        layer.style.transform = `translate(${x}px, ${y}px) skew(${skew}deg)`;
        layer.style.opacity = 0.5 + Math.random() * 0.5;
    }, 100);
}

function startGlitch() {
    const layers = [
        document.getElementById("l1"),
        document.getElementById("l2"),
        document.getElementById("l3")
    ];

    layers.forEach((layer, i) => {
        layer.style.backgroundImage = "url('image.jpg')";
        glitch(layer, (i+1)*20);
    });
}

startGlitch();

// تفاعل العقل الرقمي (نسخة أولية)
const sendBtn = document.getElementById("sendBtn");
const userInput = document.getElementById("userInput");
const responseBox = document.getElementById("responseBox");

sendBtn.addEventListener("click", () => {
    const text = userInput.value.trim();
    if (!text) return;

    // إضافة الإدخال في الصندوق
    const userDiv = document.createElement("div");
    userDiv.textContent = "أنت: " + text;
    responseBox.appendChild(userDiv);

    // ردود أولية/تفاعلية (يمكن ربط AI لاحقًا)
    const reply = document.createElement("div");
    reply.textContent = "AYHEM: " + generateReply(text);
    responseBox.appendChild(reply);

    responseBox.scrollTop = responseBox.scrollHeight;
    userInput.value = "";
});

function generateReply(input) {
    // قواعد بسيطة مبدئية، يمكن استبدالها بـ AI
    const lower = input.toLowerCase();
    if (lower.includes("مرحبا")) return "مرحبا بك في عقل أيهم.";
    if (lower.includes("كيف")) return "أنا أرى وأعيد البناء داخلك.";
    if (lower.includes("ايهم")) return "أنا أول عقل رقمي حي، أراقب كل شيء.";
    return "أفكر... " + input;
}
</script>

</body>
</html>
