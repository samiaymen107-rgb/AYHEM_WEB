<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYHEM Web Core</title>
<style>
body {
    background-color: #0a0a0a;
    color: #00ffcc;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}

button {
    padding: 15px 25px;
    margin: 10px;
    font-size: 16px;
    background-color: #111;
    color: #00ffcc;
    border: 1px solid #00ffcc;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background-color: #222;
}

#log {
    margin-top: 20px;
    text-align: left;
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #00ffcc;
    padding: 10px;
    font-size: 14px;
    background-color: #000;
}
</style>
</head>
<body>

<h1>🧠 AYHEM Web Core</h1>
<p id="status">النظام متوقف</p>

<button onclick="startCore()">تشغيل النظام</button>
<button onclick="stopCore()">إيقاف النظام</button>

<div id="log"></div>

<script>
let coreRunning = false;
let logDiv = document.getElementById("log");

function log(msg) {
    let p = document.createElement("p");
    p.textContent = msg;
    logDiv.appendChild(p);
    logDiv.scrollTop = logDiv.scrollHeight;
}

function startCore() {
    if(coreRunning) return;
    coreRunning = true;
    document.getElementById("status").innerText = "🔥 النظام يعمل";
    log("CORE: النظام بدأ بالعمل");
    coreLoop();
}

function stopCore() {
    coreRunning = false;
    document.getElementById("status").innerText = "⛔ النظام متوقف";
    log("CORE: النظام توقف");
}

function coreLoop() {
    if(!coreRunning) return;
    log("CORE: تحليل البيانات...");
    // هنا يمكن ربط ملفات JS أخرى للمشروع
    setTimeout(coreLoop, 2000);
}
</script>

</body>
</html>
