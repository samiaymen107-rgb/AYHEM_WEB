<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أيهم 3.2 – AR | AYHEM</title>
<link rel="stylesheet" href="ayhem-style.css">
<style>
body { margin:0; padding:0; font-family: Arial,sans-serif; background:#0f0f1f; color:#eee; overflow:hidden;}
header { background:#1a1a2e; padding:15px; text-align:center; font-weight:bold; font-size:1.3rem;}
#chat,#ayhemOneOut,#ayhem-top-gaps { margin:10px auto; max-width:90%; background:#162447; padding:10px; border-radius:10px; min-height:100px; overflow:auto;}
.input-bar { display:flex; justify-content:center; margin:10px; }
.input-bar input { flex:1; padding:0.5rem; margin-right:5px; border-radius:5px; border:none;}
.input-bar button { padding:0.5rem 1rem; border-radius:5px; border:none; background:#0f3460; color:#fff; cursor:pointer;}
#status { text-align:center; margin-top:5px; color:#e94560; font-size:0.9rem;}
canvas#ayhem3DAR { display:block; margin:0 auto; width:100%; height:80vh; border-radius:10px;}
</style>
</head>

<body>

<header>أيهم 3.2 – AR | AYHEM</header>

<canvas id="ayhem3DAR"></canvas>

<div id="chat">مرحباً! اسأل أيهم 3.2...</div>
<div id="status">الحالة: في وضع الاستعداد</div>

<div class="input-bar">
  <input id="input" placeholder="اكتب أو تحدث لسؤال أيهم…" autocomplete="off">
  <button id="sendBtn">إرسال</button>
  <button id="voiceBtn">🎤</button>
</div>

<hr>
<button id="ayhemOneBtn">تشغيل أيهم</button>
<pre id="ayhemOneOut"></pre>
<div id="ayhem-top-gaps"></div>
<video id="ayhemCam" autoplay muted playsinline></video>

<!-- ======= جميع وحدات أيهم 3.x ======= -->
<script src="ayhem-boot.js"></script>
<script src="ayhem-core.js"></script>
<script src="ayhem-memory-cell.js"></script>
<script src="ayhem-context-memory.js"></script>
<script src="ayhem-ai-interpreter.js"></script>
<script src="ayhem-decision-core.js"></script>
<script src="ayhem-response-engine.js"></script>
<script src="ayhem-awareness-loop.js"></script>
<script src="ayhem-fusion-core.js"></script>
<script src="ayhem-fusion-listener.js"></script>
<script src="ayhem-audio-ear.js"></script>
<script src="ayhem-audio-memory.js"></script>
<script src="ayhem-audio-learning.js"></script>
<script src="ayhem-voice-out.js"></script>
<script src="ayhem-vision-capture.js"></script>
<script src="ayhem-visual-memory.js"></script>
<script src="ayhem-visual-learning.js"></script>
<script src="ayhem-node-registry.js"></script>
<script src="ayhem-vision-cell.js"></script>
<script src="ayhem-adapter-ai.js"></script>
<script src="ayhem-self-heal.js"></script>
<script src="ayhem-network.js"></script>
<script src="ayhem-one-button.js"></script>
<script src="ayhem-fix-send.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/webxr/ARButton.js"></script>

<script>
/* ==================== أيهم AR ==================== */
const canvas = document.getElementById('ayhem3DAR');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight,0.01,20);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(ARButton.createButton(renderer, {requiredFeatures:['hit-test']}));

/* إضافة نموذج AR */
const geometry = new THREE.SphereGeometry(0.15,32,32);
const material = new THREE.MeshStandardMaterial({color:0xe94560, emissive:0x220022});
const ayhemAR = new THREE.Mesh(geometry, material);
scene.add(ayhemAR);

/* أضواء */
const light = new THREE.PointLight(0xffffff,1,10);
light.position.set(1,1,1);
scene.add(light);
scene.add(new THREE.HemisphereLight(0x888888,0x000000,1));

/* التحكم في AR */
camera.position.set(0,1,0);
renderer.setAnimationLoop(()=>renderer.render(scene,camera));

/* تحريك نموذج أيهم */
function animateAR(){
    ayhemAR.rotation.y +=0.01;
    ayhemAR.position.y=Math.sin(Date.now()*0.001)*0.05;
    requestAnimationFrame(animateAR);
}
animateAR();

/* الكاميرا الحيّة */
navigator.mediaDevices.getUserMedia({video:true,audio:false})
.then(stream=>{document.getElementById('ayhemCam').srcObject=stream;})
.catch(err=>console.warn("الكاميرا لم تعمل:",err));

/* التعرف الصوتي */
const recognition = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang="ar-TN"; recognition.interimResults=false; recognition.continuous=false;
document.getElementById("voiceBtn").addEventListener("click",()=>{recognition.start(); document.getElementById("status").innerText="الحالة: الاستماع...";});
recognition.addEventListener("result",(e)=>{
  const spoken=e.results[0][0].transcript;
  document.getElementById("input").value=spoken;
  const response=AYHEM_RUN(spoken);
  document.getElementById("chat").innerText=response;
  AYHEM_SPEAK(response);
  AYHEM_MEMORY.save(spoken,response);
});
recognition.addEventListener("end",()=>{document.getElementById("status").innerText="الحالة: في وضع الاستعداد";});
function AYHEM_SPEAK(text){ const utter = new SpeechSynthesisUtterance(text); utter.lang="ar-SA"; utter.rate=1; utter.pitch=1; window.speechSynthesis.speak(utter);}

/* إرسال النص */
document.getElementById("sendBtn").addEventListener("click",()=>{
  const question=document.getElementById("input").value.trim();
  if(!question) return alert("اكتب سؤالاً أولاً!");
  const response=AYHEM_RUN(question);
  document.getElementById("chat").innerText=response;
  AYHEM_SPEAK(response);
  AYHEM_MEMORY.save(question,response);
});

/* زر التشغيل الواحد */
document.getElementById("ayhemOneBtn").addEventListener("click",()=>{
  const question=document.getElementById("input").value.trim()||"تشغيل أيهم 3.2";
  const response=AYHEM_ONE_RUN(question);
  document.getElementById("ayhemOneOut").innerText=response;
  AYHEM_SPEAK(response);
  AYHEM_MEMORY.save(question,response);
});

/* بدء أيهم */
window.addEventListener("load",()=>{
  AYHEM_BOOT();
  if(typeof AYHEM_NODES!=="undefined") AYHEM_NODES.connect();
  document.getElementById("status").innerText="الحالة: أيهم 3.2 جاهز للعمل";
});
</script>
</body>
</html>
