name: AYHEM WOLF CORE

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  wolf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Wolf Core
        run: node ayhem_cells/AYHEM_WOLF_FINAL.js

      - name: Run Evolution
        run: node ayhem_cells/AYHEM_WOLF_EVOLVE.js
