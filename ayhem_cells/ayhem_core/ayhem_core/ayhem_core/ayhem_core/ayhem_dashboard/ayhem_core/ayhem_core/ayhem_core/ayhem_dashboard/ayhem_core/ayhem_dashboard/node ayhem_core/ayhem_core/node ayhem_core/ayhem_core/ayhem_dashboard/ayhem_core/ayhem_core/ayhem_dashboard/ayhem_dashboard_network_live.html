<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYHEM NETWORK LIVE MAP</title>
<style>
body{margin:0;padding:0;background:#111;color:#fff;font-family:sans-serif;}
header{padding:15px;text-align:center;font-size:1.6em;background:#222;}
canvas{display:block;margin:auto;background:#111;}
#networkCanvas{width:100%;height:90vh;}
</style>
</head>
<body>
<header>AYHEM AUTO-FULL NETWORK LIVE - خريطة الشبكة التفاعلية</header>
<canvas id="networkCanvas"></canvas>
<script>
const canvas=document.getElementById('networkCanvas');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let cells = []; // كل الخلايا
let links = []; // روابط بين الخلايا
let colors = ['#0f0','#00f','#f00','#ff0','#0ff','#f0f','#fff'];

// ==== محاكاة البيانات الحية (يمكن ربطها لاحقًا بـ API الشبكة) ====
function generateMockData(){
  const n = Math.max(5,cells.length);
  while(cells.length<n){
    cells.push({
      name:'Cell_'+Date.now(),
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      energy:Math.random(),
      awareness:Math.random()
    });
  }
  links = [];
  for(let i=0;i<cells.length;i++){
    for(let j=i+1;j<cells.length;j++){
      if(Math.random()>0.6) links.push([i,j]);
    }
  }
}

// ==== رسم الشبكة ====
function drawNetwork(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // روابط
  links.forEach(l=>{
    const a=cells[l[0]], b=cells[l[1]];
    ctx.strokeStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  });
  // الخلايا
  cells.forEach(c=>{
    ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
    const size=5+10*c.energy;
    ctx.beginPath();
    ctx.arc(c.x,c.y,size,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='12px sans-serif';
    ctx.fillText(c.name,c.x+8,c.y-8);
  });
}

// ==== تحديث البيانات وحركة الخلايا تلقائيًا ====
function update(){
  cells.forEach(c=>{
    c.x+=Math.random()*4-2;
    c.y+=Math.random()*4-2;
    c.energy=Math.min(1,Math.max(0,c.energy+Math.random()*0.1-0.05));
    c.awareness=Math.min(1,Math.max(0,c.awareness+Math.random()*0.1-0.05));
  });
  drawNetwork();
}

// ==== حلقة التشغيل الحي ====
generateMockData();
setInterval(()=>{
  update();
  if(Math.random()>0.9) generateMockData(); // إضافة خلايا جديدة عشوائية
},1000);

</script>
</body>
</html>
