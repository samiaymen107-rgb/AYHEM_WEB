<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>AYHEM DASHBOARD MIN</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{background:#111;color:#fff;font-family:sans-serif;}canvas{background:#222;margin:10px;border-radius:5px;}</style>
</head>
<body>
<h2>AYHEM AUTO-LIVE MIN Dashboard</h2>
<div id="charts"></div>
<script>
const reportUrl="/report";

async function fetchReport(){return await (await fetch(reportUrl)).json();}

let cellCharts={};

function createChart(cell){
  const div=document.createElement("div");
  div.innerHTML=`<h4>${cell}</h4><canvas id="${cell}_c"></canvas>`;
  document.getElementById("charts").appendChild(div);
  const ctx=document.getElementById(`${cell}_c`).getContext('2d');
  const chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[{label:'Output',data:[],borderColor:'#0f0',fill:false,tension:0.3}]},options:{animation:false,scales:{y:{min:0,max:1}}}});
  return chart;
}

async function update(){
  const report=await fetchReport();
  for(const res of report.results){
    const name=res.cell || res.component;
    if(!cellCharts[name]) cellCharts[name]=createChart(name);
    const chart=cellCharts[name];
    chart.data.labels.push(new Date().toLocaleTimeString());
    chart.data.datasets[0].data.push(res.output || 0);
    if(chart.data.labels.length>20){chart.data.labels.shift();chart.data.datasets[0].data.shift();}
    chart.update();
  }
}

setInterval(update,5000);
update();
</script>
</body>
</html>
