<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<title>لوحة المراقبة الحية - أيهم</title>
<link rel="stylesheet" href="ui/css/dashboard.css">
<style>
  body { font-family: Arial, sans-serif; background: #121212; color: #f0f0f0; }
  #system-status div { padding: 6px; margin: 4px 0; border-left: 5px solid #2ea043; background: #1e1e1e; }
  #alerts-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }

  <!-- حالة العقد والخلايا ستظهر هنا -->

</section>

<section id="control-panel">

<button data-action="reset-loads">إعادة تحميل العقد</button>
<button data-action="run-diagnostics">تشغيل التشخيص</button>
</section>

<script src="core/ayhem-core.js"></script>
